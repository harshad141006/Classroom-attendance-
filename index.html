<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management</h1>
        </header>

        <section class="form-section">
            <h2>Register Student</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber" required placeholder="e.g., 24CS073">
                </div>
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" required placeholder="e.g., Harini C">
                </div>
                <div class="error-message" id="errorMessage"></div>
                <div class="form-actions">
                    <button type="submit" id="submitBtn">Add Student</button>
                    <button type="button" id="cancelBtn" class="hidden">Cancel</button>
                </div>
            </form>
        </section>

        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search by roll number or name...">
        </section>

        <section class="students-section">
            <h2>Registered Students</h2>
            <div id="studentGrid" class="student-grid"></div>
            <div id="noStudents" class="no-students hidden">No students registered yet.</div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
